version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000" # Puerto de tu API
      - "9229:9229" # Puerto para el depurador (Debugger)
    volumes:
      - ./backend:/app
      - /app/node_modules # Aísla las dependencias de Linux de las de Windows

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000" # Puerto de React
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Obliga a React a detectar los cambios guardados